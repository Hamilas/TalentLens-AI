  <line x1="516" y1="163" x2="552" y2="163" stroke="#00A3E0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="554" y="138" width="140" height="50" rx="8" fill="#111827" stroke="#00A3E0" stroke-width="1.5"/>
